<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeerTaste | Recuperar Contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
<header class="beer-header text-center">
  <img th:src="@{/img/titulo.png}" alt="BeerTaste" class="logo-image">
</header>

<div class="page-wrapper d-flex justify-content-center align-items-center">
  <div class="login-container">
    <div class="text-center">
      <p class="subtitle">Ingresa tu correo para recuperar la contraseña</p>
    </div>

    <form th:action="@{/forgot-password}" method="post" novalidate>
      <div th:if="${param.error != null}" class="error-message">
        Email no encontrado.
      </div>
      <div th:if="${param.success != null}" class="text-success mb-3">
        Si el correo existe, recibirás un mensaje.
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" name="email" placeholder="Correo electrónico" required>
      </div>

      <div class="d-grid mt-2">
        <button type="submit" class="btn btn-primary">Recuperar Contraseña</button>
      </div>

      <div class="footer-text mt-3 text-center">
        <a th:href="@{/login}" class="forgot-link">Volver al login</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
