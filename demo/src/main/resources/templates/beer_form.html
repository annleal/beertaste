<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Beer Form</title>

    <!-- CSS -->
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- JS -->
    <script src="/js/photo.js"></script>
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4" 
        th:text="${beer.id != null} ? 'Editar Cerveza' : 'Nueva Cerveza'">
    </h2>

    <form th:action="@{/beer/api}" method="post" enctype="multipart/form-data" id="beerForm">

        <input type="hidden" th:field="*{id}">

        <!-- Nombre -->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <!-- Descripción -->
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{description}" rows="3" class="form-control"></textarea>
        </div>

        <!-- Foto -->
        <div class="mb-3">
            <label class="form-label">Foto</label>
            <input type="file" id="photoInput" name="photo" accept="image/*" class="form-control">

            <img id="previewImg" 
                 class="img-thumbnail mt-2"
                 style="max-width: 200px; display:none;"
                 th:if="${beer.photo != null}"
                 th:src="'data:image/jpeg;base64,' + ${#strings.encodeBase64(beer.photo)}">
        </div>

        <!-- Botón guardar -->
        <button type="submit" class="btn btn-primary">Guardar</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
