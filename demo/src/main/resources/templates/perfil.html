<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - BeerTaste</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/perfil.css}" />
</head>

<body class="bg-dark text-light">

    <div class="container mt-5">
        <h2 class="text-warning mb-4">Mi Perfil</h2>

        <div class="card bg-secondary shadow p-4">
            <form id="perfilForm">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="name" class="form-control" required />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" id="surname" class="form-control" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control bg-dark text-light" readonly />
                    <small class="text-warning">El correo no puede modificarse.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña (Base64)</label>
                    <input type="password" id="password" class="form-control" placeholder="Nueva contraseña" />
                    <small class="text-warning">Si no quieres cambiarla, deja este campo vacío.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">País</label>
                    <select id="country" class="form-control" required></select>
                </div>

                <button type="submit" class="btn btn-warning">Guardar cambios</button>

            </form>
        </div>
    </div>

    <script th:src="@{/js/perfil.js}"></script>
</body>
</html>
