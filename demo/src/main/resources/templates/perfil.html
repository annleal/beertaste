<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div class="container mt-5">
    <!-- Navbar incluido -->
<header th:replace="fragments/navbar :: navbar"></header>

    <h2>Mi Perfil</h2>

    <div th:if="${param.success}" class="alert alert-success">
        Perfil actualizado correctamente.
    </div>

    <form th:action="@{/miperfil}" method="post" th:object="${user}">
        <!-- Nombre -->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required disabled>
        </div>

        <!-- País -->
        <div class="mb-3">
            <label class="form-label">País</label>
            <select class="form-select" th:field="*{country}" required>
                <option value="">Seleccione un país</option>
                <option th:each="c : ${countries}"
                        th:value="${c.idCountry}"
                        th:text="${c.countryName}"
                        th:selected="${user.country != null and c.idCountry == user.country.idCountry}">
                </option>
            </select>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" th:field="*{password}" placeholder="Ingrese nueva contraseña si desea cambiarla">
        </div>

        <button type="submit" class="btn btn-success">Actualizar</button>
    </form>
</div>
</body>
</html>
