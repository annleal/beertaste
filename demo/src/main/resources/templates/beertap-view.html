<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeerTaste | BeerTap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/beertap-view.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
<header class="beer-header d-flex justify-content-between align-items-center px-4 py-2">
    <img th:src="@{/img/titulo.png}" alt="BeerTaste" class="logo-image"/>
    <div>
        <a class="btn btn-outline-warning me-2" th:href="@{/beertap}">Modo Admin</a>
    </div>
</header>

<main class="container text-center mt-4">

    <h1 class="text-warning mb-4">TAP List</h1>

    <div class="table-responsive">
        <table class="table table-dark table-striped text-light align-middle">
            <thead>
            <tr class="text-warning">
                <th>Tap</th>
                <th>Nombre</th>
                <th>Estilo</th>
                <th>Color</th>
                <th>ABV</th>
                <th>Half Pint</th>
                <th>Pint</th>
                <th>Rating</th>
            </tr>
            </thead>
            <tbody id="beerTableClient"></tbody>
        </table>
    </div>

</main>

<script th:src="@{/js/beertap-view.js}"></script>
</body>
</html>
