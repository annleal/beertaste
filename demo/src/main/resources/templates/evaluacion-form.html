<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>BeerTaste | Nueva Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1 class="mb-4">🍺 Nueva Evaluación</h1>

    <form th:action="@{/evaluaciones/guardar}" th:object="${evaluation}" method="post">
        <div class="mb-3">
            <label for="beer" class="form-label">Cerveza</label>
            <select class="form-select" id="beer" th:field="*{beer}" required>
                <option th:each="beer : ${beers}" th:value="${beer}" th:text="${beer.businessName}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="user" class="form-label">Usuario</label>
            <select class="form-select" id="user" th:field="*{user}" required>
                <option th:each="user : ${users}" th:value="${user}" th:text="${user.name} + ' (' + ${user.country.countryName} + ')'"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="rateEvaluation" class="form-label">Rating</label>
            <input type="number" class="form-control" id="rateEvaluation" th:field="*{rateEvaluation}" min="1" max="5" required>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Precio (€)</label>
            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/evaluaciones}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
