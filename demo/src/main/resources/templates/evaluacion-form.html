<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>BeerTaste | Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="p-4">
<h1 class="mb-4" th:text="${evaluation.idEvaluation} != null ? 'Editar Evaluación' : ''"></h1>

<form th:action="${evaluation.idEvaluation} != null 
                  ? @{'/evaluaciones/editar/' + ${evaluation.idEvaluation}} 
                  : @{/evaluaciones/guardar}" 
      method="post">

    <!-- Enviamos el email del usuario logueado -->
    <input type="hidden" name="email" th:value="${#authentication.name}" />

    <div class="mb-3">
        <label for="beer" class="form-label">Cerveza</label>
        <select class="form-select" id="beer" name="beerId" required>
            <option th:each="beer : ${beers}" 
                    th:value="${beer.idCerveza}" 
                    th:text="${beer.businessName}"
                    th:selected="${evaluation.beer != null} ? ${beer.idCerveza} == ${evaluation.beer.idCerveza} : false">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label for="rateEvaluation" class="form-label">Rating</label>
        <input type="number" class="form-control" id="rateEvaluation" name="rateEvaluation" min="1" max="5" 
               th:value="${evaluation.rateEvaluation}">
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Precio (€)</label>
        <input type="number" step="0.01" class="form-control" id="price" name="price" 
               th:value="${evaluation.price}">
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a th:href="@{/evaluaciones}" class="btn btn-secondary">Cancelar</a>

</form>

</body>
</html>
