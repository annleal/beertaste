<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="p-4">
<header th:replace="fragments/navbar :: navbar"></header>

<h2>Gestión de Usuarios</h2>
<button class="btn btn-primary mb-3" onclick="openCreateModal()">Nuevo Usuario</button>

<form class="row g-3 mb-4" th:action="@{/admin/users}" method="get">
    <!-- Buscar Usuario -->
    <div class="col-md-4">
        <input class="form-control"
               type="search"
               name="search"
               th:value="${search}"
               placeholder="Buscar Usuario..."/>
    </div>

    <!-- Botón Filtrar -->
    <div class="col-md-2">
        <button class="btn btn-warning w-50" type="submit">Buscar</button>
    </div>
</form>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
</table>

<!-- PAGINACIÓN -->
<nav>
    <ul id="pagination" class="pagination justify-content-center mt-4"></ul>
</nav>

<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="userForm" class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Usuario</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <!-- Campos ocultos necesarios para PUT -->
                <input type="hidden" id="idUser">
                <input type="hidden" id="country">

                <label>Nombre</label>
                <input class="form-control" id="name" required>

                <label>Apellido</label>
                <input class="form-control" id="surname" required>

                <label>Email</label>
                <input class="form-control" id="email" required>

                <label>Password (solo si se cambia)</label>
                <input type="password" class="form-control" id="password">

                <label>Rol</label>
                <select class="form-control" id="role">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="BAR">BAR</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" type="submit">Guardar</button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/user.js"></script>

</body>
</html>
