<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>BeerTaste | Mis Evaluaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/evaluation.css}">
</head>

<body class="p-4">

<!-- Navbar incluido -->
<header th:replace="fragments/navbar :: navbar"></header>

<h1 class="mb-4 text-center">Mis Evaluaciones</h1>

<!-- Filtros y añadir -->
<form class="row g-3 mb-4" th:action="@{/evaluaciones}" method="get">

    <!-- Buscar cerveza -->
    <div class="col-md-4">
        <input class="form-control"
               type="search"
               name="search"
               th:value="${search}"
               placeholder="Buscar cerveza..."/>
    </div>

    <!-- Botón Filtrar -->
    <div class="col-md-2">
        <button class="btn btn-warning w-50" type="submit">Buscar</button>
    </div>

    <!-- Botón Añadir -->
    <div class="col-md-2 d-flex align-items-center">
        <button type="button"
                class="btn btn-success d-flex justify-content-center align-items-center"
                title="Añadir evaluación"
                onclick="openEvaluationModal()">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
</form>

<div class="table-wrapper">
    <!-- Tabla de evaluaciones -->
    <table class="table table-standard">
        <thead>
        <tr>
            <th>Cerveza</th>
            <th>País</th>
            <th>Rating</th>
            <th>Precio €</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="eval : ${evaluationsPage.content}">
            <td th:text="${eval.beer.businessName}"></td>
            <td th:text="${eval.beer.country.countryName}"></td>
            <td>
                <span th:each="i : ${#numbers.sequence(1,5)}">
                    <i th:class="${i <= T(java.lang.Math).round(eval.rateEvaluation.doubleValue())
                        ? 'bi-star-fill text-warning'
                        : 'bi-star'}"></i>
                </span>
            </td>
            <td th:text="${eval.price}"></td>
            <td th:text="${#temporals.format(eval.date, 'dd/MM/yyyy')}"></td>
            <td>
                <button class="btn btn-outline-dark btn-sm"
                        th:onclick="'openEditEvaluationModal(' + ${eval.idEvaluation} + ')'">
                    Editar
                </button>
                <a th:href="@{'/evaluaciones/borrar/' + ${eval.idEvaluation}}" 
                   class="btn btn-outline-danger btn-sm"
                   onclick="return confirm('¿Seguro que quieres borrar esta evaluación?');">
                   Borrar
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(evaluationsPage.content)}">
            <td colspan="6" class="text-center text-muted">
                No tienes evaluaciones.
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- PAGINACIÓN -->
<nav th:if="${evaluationsPage.totalPages > 1}">
    <ul class="pagination justify-content-center mt-4">

        <!-- Anterior -->
        <li class="page-item" th:classappend="${evaluationsPage.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/evaluaciones(page=${currentPage - 1}, search=${search})}">
                Anterior
            </a>
        </li>

        <!-- Números de página -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(1, evaluationsPage.totalPages)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:text="${i}"
               th:href="@{/evaluaciones(page=${i}, search=${search})}">
            </a>
        </li>

        <!-- Siguiente -->
        <li class="page-item" th:classappend="${evaluationsPage.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/evaluaciones(page=${currentPage + 1}, search=${search})}">
                Siguiente
            </a>
        </li>

    </ul>
</nav>

<!-- Modal: Crear / Editar Evaluación -->
<div class="modal fade" id="evaluationModal" tabindex="-1" aria-labelledby="evaluationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content card-blur">

            <div class="modal-header">
                <h5 class="modal-title" id="evaluationModalLabel">Evaluación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body" id="modalBody">
                <div class="text-center">Cargando...</div>
            </div>

        </div>
    </div>
</div>

<script src="/js/evaluations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
