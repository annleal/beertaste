<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>BeerTaste | Mis Evaluaciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
</head>

<body class="p-4">

<h1 class="mb-4">🍺 Mis Evaluaciones</h1>

<!-- 🔎 Filtros -->
<form class="row g-3 mb-4" th:action="@{/evaluaciones}" method="get">

    <!-- Buscar cerveza -->
    <div class="col-md-4">
        <input class="form-control"
               type="search"
               name="search"
               th:value="${search}"
               placeholder="Buscar cerveza..."/>
    </div>

    <!-- Botón Filtrar -->
    <div class="col-md-2">
        <button class="btn btn-warning w-100" type="submit">Filtrar</button>
    </div>
</form>

<!-- Botón Añadir -->
<div class="mb-4">
    <a class="btn btn-success" th:href="@{/evaluaciones/nueva}">
        + Añadir Evaluación
    </a>
</div>

<!-- Tabla de evaluaciones -->
<table class="table table-striped table-hover">
    <thead>
    <tr>
        <th>Cerveza</th>
        <th>País</th>
        <th>Rating</th>
        <th>Precio</th>
        <th>Fecha</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="eval : ${evaluationsPage.content}">
        <td th:text="${eval.beer.businessName}"></td>
        <td th:text="${eval.beer.country.countryName}"></td>
        <td>
            <span th:each="i : ${#numbers.sequence(1,5)}">
                <i th:class="${i <= T(java.lang.Math).round(eval.rateEvaluation.doubleValue())
                    ? 'bi-star-fill text-warning'
                    : 'bi-star'}"></i>
            </span>
        </td>
        <td th:text="${eval.price}"></td>
        <td th:text="${#temporals.format(eval.date, 'dd/MM/yyyy')}"></td>
        <td>
            <a th:href="@{'/evaluaciones/editar/' + ${eval.idEvaluation}}" 
               class="btn btn-sm btn-primary me-1">Editar</a>
            <a th:href="@{'/evaluaciones/borrar/' + ${eval.idEvaluation}}" 
               class="btn btn-sm btn-danger"
               onclick="return confirm('¿Seguro que quieres borrar esta evaluación?');">
               Borrar
            </a>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(evaluationsPage.content)}">
        <td colspan="6" class="text-center text-muted">
            No tienes evaluaciones.
        </td>
    </tr>
    </tbody>
</table>

<!-- PAGINACIÓN -->
<nav th:if="${evaluationsPage.totalPages > 1}">
    <ul class="pagination justify-content-center mt-4">

        <!-- Anterior -->
        <li class="page-item" th:classappend="${evaluationsPage.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/evaluaciones(
                   page=${currentPage - 1},
                   search=${search}
               )}">
                Anterior
            </a>
        </li>

        <!-- Números de página -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(1, evaluationsPage.totalPages)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:text="${i}"
               th:href="@{/evaluaciones(
                   page=${i},
                   search=${search}
               )}">
            </a>
        </li>

        <!-- Siguiente -->
        <li class="page-item" th:classappend="${evaluationsPage.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/evaluaciones(
                   page=${currentPage + 1},
                   search=${search}
               )}">
                Siguiente
            </a>
        </li>

    </ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
