<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeerTaste | BeerTap Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link th:href="@{/css/beertap.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="p-4">
<!-- Navbar incluido -->
<header th:replace="fragments/navbar :: navbar"></header>

<div>
        <a id="openClientView" class="btn btn-warning">Modo Cliente</a>
    </div>
<main class="container text-center mt-4">

    <h1 class="text-warning mb-4">Gestión de Grifos</h1>

    <!-- FORMULARIO: búsqueda + auto-rellenado -->
    <div class="card shadow-sm mb-4 p-4 admin-card position-relative">
        <h4 class="text-warning">Añadir / Editar Cerveza</h4>

        <div class="row g-2 align-items-center mt-3">

            <!-- Buscar cerveza -->
            <div class="col-md-5 position-relative">
                <label class="form-label text-start text-light d-block">Buscar cerveza</label>
                <input id="beerSearchInput" type="text" class="form-control" placeholder="Escribe nombre de cerveza..." autocomplete="off">
                <div id="beerSuggestions" class="suggestions-box"></div>
            </div>

            <div class="col-md-2">
                <label class="form-label text-start text-light d-block">ABV</label>
                <input id="beerAbv" type="number" step="0.1" class="form-control" placeholder="ABV" readonly>
            </div>

            <div class="col-md-2">
                <label class="form-label text-start text-light d-block">Estilo</label>
                <input id="beerStyle" type="text" class="form-control" placeholder="Estilo" readonly>
            </div>

            <div class="col-md-1">
                <label class="form-label text-start text-light d-block">Color</label>
                <input id="beerColor" type="text" class="form-control" readonly>
            </div>

            <div class="col-md-2">
                <label class="form-label text-start text-light d-block">Rating</label>
                <div id="beerRating" class="text-warning">—</div>
            </div>

            <!-- Precios y Tap -->
            <div class="col-md-3 mt-3">
                <label class="form-label text-start text-light d-block">Precio Half Pint (€)</label>
                <input id="beerHalf" type="number" step="0.01" class="form-control" placeholder="0.00">
            </div>
            <div class="col-md-3 mt-3">
                <label class="form-label text-start text-light d-block">Precio Pint (€)</label>
                <input id="beerPint" type="number" step="0.01" class="form-control" placeholder="0.00">
            </div>
            <div class="col-md-3 mt-3">
                <label class="form-label text-start text-light d-block">Número grifo (tap)</label>
                <input id="beerTapNumber" type="text" class="form-control" placeholder="p.ej. 1, A, B1">
            </div>

            <div class="col-md-3 mt-3 d-flex gap-2">
                <button id="addOrUpdateBtn" class="btn btn-outline-warning w-100">
                    <i class="bi bi-plus-circle me-1"></i><span id="addOrUpdateLabel">Añadir</span>
                </button>
                <button id="clearFormBtn" class="btn btn-secondary w-100">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- TABLA: listado de grifos -->
    <div class="card shadow-sm p-4 admin-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-warning mb-0">Listado de Grifos</h4>
            <div>
                <button id="saveBtn" class="btn btn-warning me-2"><i class="bi bi-save"></i> Guardar</button>
                <button id="reloadBtn" class="btn btn-outline-warning"><i class="bi bi-arrow-clockwise"></i> Recargar</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table text-light align-middle">
                <thead>
                <tr class="text-warning">
                    <th style="width:6rem">Tap</th>
                    <th>Nombre</th>
                    <th>Estilo</th>
                    <th>Color</th>
                    <th>ABV</th>
                    <th>Half Pint</th>
                    <th>Pint</th>
                    <th>Rating</th>
                    <th style="width:8rem"></th>
                </tr>
                </thead>
                <tbody id="beerTable"></tbody>
            </table>
        </div>
    </div>

</main>

<script th:src="@{/js/beertap.js}"></script>
</body>
</html>
