<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>BeerTaste | Catálogo de Cervezas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/beer.css}">
</head>

<body class="p-4">
<!-- Navbar incluido -->
<header th:replace="fragments/navbar :: navbar"></header>


<div class="container mt-4">

    <h1 class="mb-4 text-center">🍺 Catálogo de Cervezas</h1>
    <!--div class="table-responsive"-->
    <!--table class="table table-bordered table-striped"-->
    <div class="table-wrapper">
    <table class="table table-standard">
        <thead>
            <tr class="align-middle">
                <th>Nombre</th>
                <th>País</th>
                <th>ABV</th>
                <th>Estilo</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="beer : ${beersPage.content}">
                <td th:text="${#strings.abbreviate(beer.businessName, 30)}"></td>
                <td th:text="${beer.country.countryName}"></td>
                <td th:text="${beer.abv}"></td>
                <td th:text="${beer.style.styleName}"></td>
                <td>
                    <button class="btn btn-info btn-sm"
                            th:if="${beer.photo != null}"
                            th:onclick="'showPhoto(' + ${beer.idCerveza} + ')'">
                        Ver Foto
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
    <!-- PAGINACIÓN -->
    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-secondary" th:if="${beersPage.hasPrevious()}"
                th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}-1) + '\''">Anterior</button>

        <span>
            Página <span th:text="${beersPage.number+1}"></span>
            de <span th:text="${beersPage.totalPages}"></span>
        </span>

        <button class="btn btn-secondary" th:if="${beersPage.hasNext()}"
                th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}+1) + '\''">Siguiente</button>
    </div>

</div>

<!-- MODAL -->
<div id="photoModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modalImage" style="max-width:100%; border-radius:8px;">
    </div>
</div>

<script src="/js/beer.js"></script>
</body>
</html>
