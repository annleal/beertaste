<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>BeerTaste | Catálogo de Cervezas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/beer.css}"/>
</head>
<body class="p-4 bg-dark text-light">
<h1 class="mb-4">🍺 Catálogo de Cervezas</h1>

<form class="row g-3 mb-4" th:action="@{/beer}" method="get">
    <div class="col-md-6">
        <input class="form-control" type="search" name="search" th:value="${search}" placeholder="Buscar cerveza..."/>
    </div>
    <div class="col-md-2">
        <button class="btn btn-warning w-100" type="submit">Buscar</button>
    </div>
</form>

<table class="table table-striped table-hover table-dark">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>País</th>
            <th>ABV</th>
            <th>Estilo</th>
            <th>Foto</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="beer : ${beersPage.content}">
            <td th:text="${beer.businessName}"></td>
            <td th:text="${beer.country.countryName}"></td>
            <td th:text="${beer.abv}"></td>
            <td th:text="${beer.style.styleName}"></td>
            <td>
                <button class="btn btn-sm btn-info" 
                        th:if="${beer.photo != null}" 
                        th:onclick="'showPhoto(' + ${beer.idCerveza} + ')'">
                    Ver foto
                </button>
            </td>
            <td>
                <button class="btn btn-sm btn-warning" 
                        th:if="${beer.user != null and (beer.user.id == #authentication.principal.id or #authentication.principal.role == 'ADMIN')}">
                    Editar
                </button>
                <button class="btn btn-sm btn-danger" 
                        th:if="${beer.user != null and (beer.user.id == #authentication.principal.id or #authentication.principal.role == 'ADMIN')}">
                    Borrar
                </button>
            </td>
        </tr>
        <tr th:if="${beersPage.totalElements == 0}">
            <td colspan="6" class="text-center text-muted">No hay cervezas disponibles.</td>
        </tr>
    </tbody>
</table>

<!-- PAGINACIÓN -->
<nav th:if="${beersPage.totalPages > 1}">
    <ul class="pagination justify-content-center mt-4">
        <li class="page-item" th:classappend="${beersPage.first} ? 'disabled'">
            <a class="page-link" th:href="@{/beer(page=${beersPage.number - 1}, search=${search})}">Anterior</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, beersPage.totalPages - 1)}" th:classappend="${beersPage.number == i} ? 'active'">
            <a class="page-link" th:text="${i + 1}" th:href="@{/beer(page=${i}, search=${search})}"></a>
        </li>
        <li class="page-item" th:classappend="${beersPage.last} ? 'disabled'">
            <a class="page-link" th:href="@{/beer(page=${beersPage.number + 1}, search=${search})}">Siguiente</a>
        </li>
    </ul>
</nav>

<script>
function showPhoto(id) {
    fetch('/beer/api/' + id)
        .then(res => res.json())
        .then(data => {
            if(data.photo) {
                const img = new Image();
                img.src = 'data:image/png;base64,' + btoa(String.fromCharCode.apply(null, new Uint8Array(data.photo)));
                const w = window.open("");
                w.document.write(img.outerHTML);
            }
        });
}
</script>

</body>
</html>
