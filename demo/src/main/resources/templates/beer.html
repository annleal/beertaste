<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>BeerTaste | Catálogo de Cervezas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/beer.css}">
</head>

<body class="p-4 bg-dark text-light">

<h1 class="mb-4">🍺 Catálogo de Cervezas</h1>

<table class="table table-dark table-hover">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>País</th>
            <th>ABV</th>
            <th>Estilo</th>
            <th>Foto</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="beer : ${beersPage.content}">
            <td th:text="${#strings.abbreviate(beer.businessName, 30)}"></td>
            <td th:text="${beer.country.countryName}"></td>
            <td th:text="${beer.abv}"></td>
            <td th:text="${beer.style.styleName}"></td>
            <td>
                <button class="btn btn-info btn-sm"
                        th:if="${beer.photo != null}"
                        th:onclick="'showPhoto(' + ${beer.idCerveza} + ')'">
                    Ver Foto
                </button>
            </td>
        </tr>
    </tbody>
</table>

<!-- PAGINACIÓN -->
<div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" th:if="${beersPage.hasPrevious()}" 
            th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}-1) + '\'+'">Anterior</button>
    <span> Página <span th:text="${beersPage.number+1}"></span> de <span th:text="${beersPage.totalPages}"></span> </span>
    <button class="btn btn-secondary" th:if="${beersPage.hasNext()}" 
            th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}+1) + '\'+'">Siguiente</button>
</div>

<!-- MODAL -->
<div id="photoModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modalImage" style="max-width:100%; border-radius:8px;">
    </div>
</div>

<script src="/js/beer.js"></script>
</body>
</html>
