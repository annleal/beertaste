<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>BeerTaste | Catálogo de Cervezas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/beer.css}">
</head>

<body class="p-4">
<!-- Navbar incluido -->
<header th:replace="fragments/navbar :: navbar"></header>


<div class="container mt-4">

    <h1 class="mb-4 text-center">🍺 Catálogo de Cervezas</h1>
    <!--div class="table-responsive"-->
    <!--table class="table table-bordered table-striped"-->
 
<!-- Filtros y añadir -->
<form class="row g-3 mb-4" th:action="@{/beer}" method="get">
    <!-- Buscar cerveza -->
    <div class="col-md-4">
        <input class="form-control"
               type="search"
               name="search"
               th:value="${search}"
               placeholder="Buscar cerveza..."
               aria-label="Buscar cerveza"/>
    </div>

    <!-- Botón Filtrar -->
    <div class="col-md-2">
        <button class="btn btn-warning w-100" type="submit">Buscar</button>
    </div>
</form>

    
    <!-- Botón para ADMIN -->
<div class="mb-3 text-end" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#beerModal">
        <i class="bi bi-plus-lg"></i> Añadir Cerveza
    </button>
</div>

    <div class="table-wrapper">
    <table class="table table-standard">
        <thead>
            <tr class="align-middle">
                <th>Nombre</th>
                <th>País</th>
                <th>ABV</th>
                <th>Estilo</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="beer : ${beersPage.content}">
                <td th:text="${#strings.abbreviate(beer.businessName, 30)}"></td>
                <td th:text="${beer.country.countryName}"></td>
                <td th:text="${beer.abv}"></td>
                <td th:text="${beer.style.styleName}"></td>
                <td>
                    <button class="btn btn-info btn-sm"
                            th:if="${beer.photo != null}"
                            th:onclick="'showPhoto(' + ${beer.idCerveza} + ')'">
                        Ver Foto
                    </button>
                    <button class="btn btn-warning btn-sm"
    th:attr="data-id=${beer.idCerveza}, 
             data-name=${beer.businessName}, 
             data-abv=${beer.abv}, 
             data-country=${beer.country.idCountry}, 
             data-style=${beer.style.styleId}, 
             data-hasphoto=${beer.photo != null}"
    onclick="editBeer(this)">
<i class="bi bi-pencil"></i> Editar
</button>
                </td>
     
            </tr>
        </tbody>
    </table>
    </div>
    <!-- PAGINACIÓN -->
    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-secondary" th:if="${beersPage.hasPrevious()}"
                th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}-1) + '\''">Anterior</button>

        <span>
            Página <span th:text="${beersPage.number+1}"></span>
            de <span th:text="${beersPage.totalPages}"></span>
        </span>

        <button class="btn btn-secondary" th:if="${beersPage.hasNext()}"
                th:onclick="'location.href=\'/beer?page=' + (${beersPage.number}+1) + '\''">Siguiente</button>
    </div>

</div>


<!-- Modal ver foto (custom) -->
<div id="photoModal" class="custom-modal">
    <div class="custom-modal-content">
        <span class="custom-close">&times;</span>
        <img id="modalImage" style="max-width:100%; border-radius:8px;">
    </div>
</div>

<!-- Modal crear/editar cerveza (Bootstrap 5) -->
<div class="modal fade" id="beerModal" tabindex="-1" aria-labelledby="beerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/beer/api}" method="post" enctype="multipart/form-data" id="beerForm">
        <div class="modal-header">
          <h5 class="modal-title" id="beerModalLabel">Crear / Editar Cerveza</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <!-- Preview imagen -->
          <img id="previewImgModal" style="max-width:100%; display:none; margin-bottom:10px; border-radius:8px;">

          <!-- Nombre -->
          <div class="mb-3">
            <label for="businessName" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="businessName" name="businessName" required>
          </div>

          <!-- País -->
          <div class="mb-3">
            <label for="country" class="form-label">País</label>
            <select class="form-select" id="country" name="country" required>
              <option value="">Seleccione un país</option>
              <option th:each="c : ${countries}" th:value="${c.idCountry}" th:text="${c.countryName}"></option>
            </select>
          </div>

          <!-- ABV -->
          <div class="mb-3">
            <label for="abv" class="form-label">ABV (%)</label>
            <input type="number" step="0.1" class="form-control" id="abv" name="abv" required>
          </div>

          <!-- Estilo -->
          <div class="mb-3">
            <label for="style" class="form-label">Estilo</label>
            <select class="form-select" id="style" name="style" required>
              <option value="">Selecciona un estilo</option>
              <option th:each="s : ${styles}" th:value="${s.styleId}" th:text="${s.styleName}"></option>
            </select>
          </div>

          <!-- Foto -->
          <div class="mb-3">
            <label for="photo" class="form-label">Foto</label>
            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>



<script src="/js/beer.js"></script>



</body>
</html>
