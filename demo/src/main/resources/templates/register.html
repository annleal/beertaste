<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeerTaste | Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/login.css}" rel="stylesheet" />
    <!-- reutilizamos CSS del login -->
  </head>
  <body>
    <header class="beer-header text-center">
      <img th:src="@{/img/titulo.png}" alt="BeerTaste" class="logo-image" />
    </header>

    <div class="page-wrapper d-flex justify-content-center align-items-center">
      <div class="login-container">
        <div class="text-center">
          <p class="subtitle">Crea tu cuenta para continuar</p>
        </div>

        <form th:action="@{/register}" method="post" novalidate>
          <div th:if="${param.error != null}" class="error-message">
            Error al registrar. Revisa los campos.
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="name"
              placeholder="Nombre"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="surname"
              placeholder="Apellido"
              required
            />
          </div>
        <div class="mb-3">
            <label for="country" class="form-label">País de origen</label>
            <select id="country"  class="form-select" required>
              <option value="">Selecciona un país</option>
              <option
                th:each="country : ${countries}"
                th:value="${country.idCountry}"
                th:text="${country.countryName}"
                th:selected="${user.country != null} ? ${c.idCountry} == ${user.country.idCountry} : false">
              ></option>
            </select>
          </div>
          <div class="mb-3">
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="Email"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              name="password"
              placeholder="Contraseña"
              required
            />
          </div>

          <div class="d-grid mt-2">
            <button type="submit" class="btn btn-primary">Registrarse</button>
          </div>

          <div class="footer-text mt-3 text-center">
            <a th:href="@{/login}" class="forgot-link"
              >¿Ya tienes cuenta? Inicia sesión</a
            >
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
