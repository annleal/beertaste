<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeerTaste | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
      <link th:href="@{/css/login.css}" rel="stylesheet" />
     
  </head>
  <body class="login-page">
    <!-- HEADER CON IMAGEN -->
    <header class="beer-header text-center">
      <!-- Thymeleaf resolver -->
      <img th:src="@{/img/titulo.png}" alt="BeerTaste" class="logo-image" />
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="page-wrapper d-flex justify-content-center align-items-center">
      <div class="login-container">
        <div class="text-center">
          <p class="subtitle">Inicia sesión para continuar</p>
        </div>

        <form th:action="@{/login}" method="post" novalidate>
          <!-- MENSAJES DINÁMICOS -->
          <div
            th:if="${errorMessage}"
            class="error-message"
            th:text="${errorMessage}"
          ></div>
          <div
            th:if="${logoutMessage}"
            class="success-message"
            th:text="${logoutMessage}"
          ></div>

          <div th:if="${param.error != null}" class="error-message">
            Usuario o contraseña incorrectos.
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Usuario"
              required
              autofocus
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Contraseña"
              required
            />
          </div>

          <div class="d-grid mt-2">
            <button type="submit" class="btn btn-primary">
              Iniciar Sesión
            </button>
          </div>

          <div class="footer-text mt-3 text-center">
            <a th:href="@{/forgot-password}" class="forgot-link"
              >¿Olvidaste tu contraseña?</a
            >
            <div class ="footer-text mt-4 text-center">¿No tienes cuenta?<a th:href="@{/register}" class="register-link">Regístrate</a>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Banner de cookies -->
    <div id="cookie-banner" class="cookie-banner d-none">
      <p>
        Usamos cookies para mejorar tu experiencia. Al continuar navegando,
        aceptas nuestra
        <a href="/politica-cookies" target="_blank">Política de Cookies</a>.
      </p>
      <div class="cookie-buttons">
        <button id="accept-cookies" class="btn btn-success btn-sm">
          Aceptar
        </button>
        <button id="reject-cookies" class="btn btn-outline-secondary btn-sm">
          Rechazar
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/login.js}"></script>
    <script th:src="@{/js/cookies.js}"></script>
  </body>
</html>
